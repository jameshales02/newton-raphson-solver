name: tests

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Order book benchmark (informational)
        run: node bench/orderbook-bench.js 300000

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/data-pipeline/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
